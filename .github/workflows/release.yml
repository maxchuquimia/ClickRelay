name: Release

# Runs only when a v* tag is pushed. Pull requests, including ones from forks,
# never run this workflow, so a PR that edits it can't reach the secrets.
# The secrets live in the `release` environment, which only accepts v* tags
# and waits for the owner's approval before this job starts. scripts/release.sh
# lists the secrets it reads.
on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Leave empty to use the newest stable Xcode on the runner, or pin one,
  # e.g. "27.1", to match /Applications/Xcode_27.1.app.
  XCODE_VERSION: ""

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write      # create the release and upload the zip
      id-token: write      # sign the build provenance attestation
      attestations: write  # store the attestation
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            echo "::error::Tag '$TAG' isn't vX.Y.Z or vX.Y.Z-suffix."
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          # Only release code that has landed on main.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG points at $GITHUB_SHA, which isn't on main."
            exit 1
          fi
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Select Xcode
        run: |
          if [ -n "$XCODE_VERSION" ]; then
            xcode="/Applications/Xcode_${XCODE_VERSION}.app"
          else
            xcode="$(ls -d /Applications/Xcode_*.app | grep -Eiv 'beta|release_candidate|_rc' | sort -V | tail -n 1)"
          fi
          [ -d "$xcode" ] || { echo "::error::Xcode not found at '$xcode'."; ls -d /Applications/Xcode*.app; exit 1; }
          sudo xcode-select --switch "$xcode/Contents/Developer"
          xcodebuild -version

      - name: Build, sign, notarize and package
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          OUTPUT_DIR: ${{ github.workspace }}/dist
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: scripts/release.sh "$VERSION" "$BUILD_NUMBER"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/ClickRelay-*.zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.tag.outputs.version }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          zip="dist/ClickRelay-$VERSION.zip"
          sha256="$(cut -d' ' -f1 "$zip.sha256")"
          xcode="$(xcodebuild -version | tr '\n' ' ' | sed 's/ *$//')"
          cat > dist/notes.md <<EOF
          Built by [this workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) from commit \`$GITHUB_SHA\`.

          - $xcode, macOS $(sw_vers -productVersion), runner image ${ImageOS:-unknown} ${ImageVersion:-unknown}
          - SHA-256 of \`ClickRelay-$VERSION.zip\`: \`$sha256\`

          ### Verify this download

          \`\`\`sh
          # Built by this repository's release workflow from the commit above
          gh attestation verify ClickRelay-$VERSION.zip --repo $GITHUB_REPOSITORY
          shasum -a 256 ClickRelay-$VERSION.zip

          # After unzipping: signed by team D3NCG82LUC, notarized by Apple
          codesign -dv --verbose=4 ClickRelay.app 2>&1 | grep -E 'Authority|TeamIdentifier'
          spctl -a -vv ClickRelay.app
          xcrun stapler validate ClickRelay.app
          \`\`\`

          EOF
          flags=()
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          # Upload to a draft, then publish, so an immutable release never
          # goes public half-finished.
          gh release create "$TAG" --draft --verify-tag \
            --title "ClickRelay $VERSION" \
            --notes-file dist/notes.md --generate-notes \
            ${flags[@]+"${flags[@]}"} \
            "$zip" "$zip.sha256"
          gh release edit "$TAG" --draft=false
